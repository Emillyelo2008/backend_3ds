<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras</title>
    <!-- Importação de Fontes e Ícones Modernos -->
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div
        style="background-color: #ffffff; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0;">

        <!-- Espaço Reservado para Imagem/Banner (Placeholder) -->
        <div
            style="width: 100%; height: 160px; background-color: #f1f5f9; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem; border: 2px dashed #cbd5e1;">
            <i class="fa-solid fa-image" style="font-size: 2.5rem; color: #94a3b8;"></i>
        </div>

        <!-- Cabeçalho -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 1.75rem; color: #4f46e5;"></i>
            <h3 style="margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; color: #1e1b4b;">
                Compras</h3>
        </div>

        <p style="margin: 0 0 2rem 0; color: #64748b; font-size: 1rem; font-weight: 400;">Bem-vindo(a) ao seu painel</p>

        <!-- Links de Navegação / Botões -->
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">

            <a href="/"
                style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; background-color: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 0.95rem; transition: background-color 0.2s;">
                <i class="fa-solid fa-house" style="font-size: 1rem;"></i>
                Início Home
            </a>

            <a href="/erro"
                style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; background-color: #ef4444; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500; font-size: 0.95rem; transition: background-color 0.2s;">
                <i class="fa-solid fa-triangle-exclamation" style="font-size: 1rem;"></i>
                Página de Erro
            </a>

        </div>
    </div>

</body>

</html>
