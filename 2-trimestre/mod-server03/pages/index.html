<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras de Roupas</title>
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <!-- Card Principal -->
    <div style="background-color: #ffffff; width: 100%; max-width: 420px; margin: 20px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center;">
        
        <!-- Placeholder da Imagem/Logo -->
        <div style="width: 80px; height: 80px; background-color: #eef2f3; border: 2px dashed #cbd5e1; border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; color: #94a3b8; font-size: 12px; font-weight: 500;">
            [ LOGO ]
        </div>

        <!-- Título Principal -->
        <h3 style="margin: 0 0 10px 0; color: #0f172a; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;">
            Página Inicial
        </h3>
        
        <!-- Texto de Boas-Vindas -->
        <p style="margin: 0 0 30px 0; color: #64748b; font-size: 16px; line-height: 1.5;">
            Bem-vindo(a) à nossa loja! Explore as melhores tendências do mercado.
        </p>

        <!-- Menu de Navegação / Botões -->
        <nav style="display: flex; flex-direction: column; gap: 12px;">
            
            <!-- Botão Início Home -->
            <a href="/" style="display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: background-color 0.2s;">
                <!-- Ícone de Home (SVG) -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Início Home
            </a>
            
            <!-- Botão Página de Erro -->
            <a href="/erro" style="display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #fee2e2; color: #dc2626; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: background-color 0.2s;">
                <!-- Ícone de Alerta/Erro (SVG) -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                Página de Erro
            </a>

        </nav>
    </div>

</body>
</html>
